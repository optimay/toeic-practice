t:850;cursor:pointer;margin:12px 0}.status{text-align:center;min-height:20px;color:var(--blue);font-size:12px}.answers{display:grid;gap:9px}.answer{border:1px solid #cfd9e2;background:#fff;border-radius:10px;padding:13px 14px;text-align:left;font-size:14px;font-weight:700;color:var(--text);cursor:pointer}.answer:hover{background:#eef4f8}.answer.correct{background:#e9f5ef;border-color:#67a88e;color:var(--green)}.answer.wrong{background:#faeeee;border-color:#c98787;color:var(--red)}.result{margin-top:18px;padding:22px;display:none}.result.show{display:block}.resultHead{font-size:19px;font-weight:900}.ok{color:var(--green)}.bad{color:var(--red)}.translation,.explain{margin-top:14px;padding:14px;border-radius:10px;background:#f7f9fb;line-height:1.75;font-size:14px}.transcript{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}.tline{padding:8px;border-radius:8px}.tline.correctLine{background:#edf7f2}.zh{color:#6e7e8c;font-size:13px;margin-top:3px}.next{margin-top:16px;border:0;background:var(--gold);color:#fff;border-radius:9px;padding:12px 20px;font-weight:850;cursor:pointer;float:right}.clear{clear:both}.selectBox{max-width:720px;margin:35px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px}.selectBox h2{color:var(--navy);margin-top:0}.modeBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.modeBtn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:16px;cursor:pointer;text-align:left}.modeBtn:hover{border-color:#8ca5ba;background:#f5f8fa}.modeBtn b{display:block;color:var(--navy);margin-bottom:5px}.modeBtn span{font-size:12px;color:var(--muted)}.finish{text-align:center;padding:40px}.score{font-size:52px;font-weight:900;color:var(--navy)}.restart{border:0;background:var(--navy);color:#fff;border-radius:9px;padding:12px 20px;font-weight:850;cursor:pointer}.badge{display:inline-block;font-size:11px;font-weight:850;background:#eef3f7;color:var(--blue);padding:5px 8px;border-ra const BANK={1:P1_FULL,2:P2_FULL,3:P3_FULL,4:P4_FULL,5:P5_FULL,6:P6_FULL,7:P7_FULL};
let state={part:1,items:[],i:0,score:0,sub:0,answered:false};
function progress(){try{return JSON.parse(localStorage.getItem('toeicAppProgress')||'{}')}catch(e){return {}}}function saveProg(p,correct){let d=progress();let x=d[p]||{done:0,correct:0};x.done++;if(correct)x.correct++;d[p]=x;try{localStorage.setItem('toeicAppProgress',JSON.stringify(d))}catch(e){}}
function nav(){document.getElementById('nav').innerHTML='<button class="active" onclick="dashboard()">Dashboard</button>'+Object.keys(META).map(n=>`<button onclick="selectPart(${n})">Part ${n}</button>`).join('')}
function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}
function dashboard(){show('dashboard');let d=progress(),done=0,total=805;Object.values(d).forEach(x=>done+=x.done||0);let pct=Math.min(100,Math.round(done/total*100));let parts=Object.keys(META).map(n=>{let m=META[n],x=d[n]||{done:0,correct:0},acc=x.done?Math.round(x.correct/x.done*100):0;return `<div class="part ${n<=4?'listen':'read'}" onclick="selectPart(${n})"><div class="partno">PART ${n}</div><h3>${m[0]}</h3><div class="eng">${m[1]}</div><div class="qmeta">目標題庫 ${m[3]} 題</div><div class="pstat"><span>已作答 <b>${x.done}</b></span><b>${acc}% 正確</b></div><div class="mini"><div class="minifill" style="width:${Math.min(100,x.done/m[3]*100)}%"></div></div><div class="go">→</div></div>`}).join('');document.getElementById('dashboard').innerHTML=`<div class="title"><div><h1>Dashboard</h1><div class="small">Part 1–7 整體練習進度</div></div></div><div class="summary"><div class="card"><div class="label">OVERALL PROGRESS · 整體達標進度</div><div class="big">${done} <span style="font-size:15px;color:#83919e">/ ${total} Questions</span></div><div class="track"><div class="fill" style="width:${pct}%"></div></div><div class="states"><span><i class="dot green"></i>Completed ${done}</span><span><i class="dot gray"></i>Remaining ${Math.max(0,total-done)}</span></div></div><div class="card"><div class="label">TARGET</div><div class="big">800+</div><div class="small">TOEIC L&R</div></div><div class="card"><div class="label">LEARNING RULE</div><div style="font-weight:850;margin-top:10px">答題後顯示中文</div><div class="small" style="margin-top:6px">Listening 同時顯示 Transcript</div></div></div><div class="parts"><div class="sectionhead">LISTENING · PART 1–4</div>${parts.slice(0,parts.indexOf('<div class="part read')).trim()}<div class="sectionhead">READING · PART 5–7</div>${parts.slice(parts.indexOf('<div class="part read'))}</div>`}
function selectPart(p){state.part=p;show('partSelect');let m=META[p];document.getElementById('partSelect').innerHTML=`<div class="selectBox"><button class="back" onclick="dashboard()">← Back to Dashboard</button><div class="parttag">PART ${p}</div><h2>${m[0]} <span class="small">${m[1]}</span></h2><p style="line-height:1.7;color:#617487">${p<=4?'作答前不顯示英文內容；播放語音後選答案。答完立即顯示 Transcript、中文翻譯與解析。':'先用英文完成題目；答完立即顯示中文翻譯與考點解析。'}</p><div class="modeBtns"><button class="modeBtn" onclick="start(${p},'quick')"><b>Quick Practice</b><span>${p==1?'6 題':p==2?'3 題':p==3||p==4?'1 組':'目前示範題庫全題'}</span></button><button class="modeBtn" onclick="start(${p},'random')"><b>Random Practice</b><span>隨機抽題 / 題組</span></button><button class="modeBtn" onclick="start(${p},'all')"><b>Full Bank</b><span>目前內建題庫全部練習</span></button></div><p class="small" style="margin-top:20px">穩定版：保留已確認的原始 UI 與答題流程；不含 Wrong Answer 功能。</p></div>`}
function shuffle(a){return a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}
function start(p,mode){let bank=shuffle([...BANK[p]]),items=bank;if(mode==='quick'){let n=p===1?6:p===2?10:(p===3||p===4)?2:p===5?10:(p===6||p===7)?2:10;items=bank.slice(0,n)}if(mode==='random'){let n=p===1?10:p===2?20:(p===3||p===4)?5:p===5?20:(p===6||p===7)?5:10;items=bank.slice(0,n)}state={part:p,items:items,i:0,score:0,sub:0,answered:false};show('practice');render()}
function speak(t,rate=.9){return new Promise(res=>{let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate;let vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.lang==='en-US'&&/Jenny|Aria|Samantha|Zira|Google US/i.test(v.name))||vs.find(v=>v.lang&&v.lang.startsWith('en-US'))||null;u.onend=res;u.onerror=res;speechSynthesis.speak(u)})}
async function playLines(lines){speechSynthesis.cancel();document.getElementById('status').textContent='Playing...';for(let s of lines){await speak(s);await new Promise(r=>setTimeout(r,350))}document.getElementById('status').textContent='請選擇答案'}
function shell(left,right){document.getElementById('practice').innerHTML=`<div class="toolbar"><button class="back" onclick="selectPart(${state.part})">← Part ${state.part}</button><span class="pill">${state.i+1} / ${state.items.length}</span></div><div class="practiceGrid"><div class="practiceCard">${left}</div><div class="practiceCard">${right}</div></div><div class="result" id="result"></div>`}
function render(){state.answered=false;let p=state.part,x=state.items[state.i];if(p===1){shell(`<img class="photo" src="${x.img}"><div class="credit">Offline practice illustration</div>`,`<div class="parttag">LISTENING · PART 1</div><div class="question">看照片並聆聽四個敘述</div><button class="play" onclick='playLines(${JSON.stringify(x.opts.map((o,i)=>String.fromCharCode(65+i)+". "+o))})'>🔊 Play A–D</button><div class="status" id="status">準備好後按 Play</div><div class="answers">${x.opts.map((_,i)=>`<button class="answer" onclick="answer(${i})">${String.fromCharCode(65+i)}</button>`).join('')}</div>`)}else if(p===2){shell(`<div class="passage" style="display:flex;align-items:center;justify-content:center;text-align:center"><div><div style="font-size:48px">🎧</div><b>Question–Response</b><div class="small" style="margin-top:8px">試題本不顯示英文</div></div></div>`,`<div class="parttag">LISTENING · PART 2</div><button class="play" onclick='playLines(${JSON.stringify([x.audio,...x.opts.map((o,i)=>String.fromCharCode(65+i)+". "+o)])})'>🔊 Play Question + A–C</button><div class="status" id="status">準備好後按 Play</div><div class="answers">${x.opts.map((_,i)=>`<button class="answer" onclick="answer(${i})">${String.fromCharCode(65+i)}</button>`).join('')}</div>`)}else if(p===3||p===4){let q=x.qs[state.sub];shell(`<div class="passage" style="display:flex;align-items:center;justify-content:center;text-align:center"><div><div style="font-size:48px">${p===3?'👥':'📢'}</div><b>${META[p][1]}</b><div class="small">聽完整段落後回答 3 題</div><button class="play" onclick='playLines(${JSON.stringify(x.audio)})'>🔊 Play ${p===3?'Conversation':'Talk'}</button><div class="status" id="status"></div></div></div>`,`<div class="parttag">PART ${p} · QUESTION ${state.sub+1}/3</div><div class="question">${q[0]}</div><div class="answers">${q[1].map((o,i)=>`<button class="answer" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>`)}else if(p===5){shell(`<div class="passage"><span class="badge">PART 5</span><div class="question">${x.q}</div></div>`,`<div class="parttag">READING · PART 5</div><div class="answers">${x.opts.map((o,i)=>`<button class="answer" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>`)}else if(p===6||p===7){let q=x.qs[state.sub];shell(`<div class="passage">${x.passage}</div>`,`<div class="parttag">READING · PART ${p}</div><div class="question">${q[0]}</div><div class="answers">${q[1].map((o,i)=>`<button class="answer" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>`)} }
function answer(n){if(state.answered)return;state.answered=true;let p=state.part,x=state.items[state.i],correct,detail='';if(p===1||p===2||p===5){correct=x.correct}else{correct=x.qs[state.sub][2]}let ok=n===correct;if(ok)state.score++;saveProg(p,ok);document.querySelectorAll('.answer').forEach((b,i)=>{b.disabled=true;if(i===correct)b.classList.add('correct');if(i===n&&!ok)b.classList.add('wrong')});let r=document.getElementById('result');let head=ok?'<span class="ok">✓ Correct</span>':`<span class="bad">✕ Incorrect</span>　正確答案：${String.fromCharCode(65+correct)}`;if(p===1){detail=`<div class="transcript">${x.opts.map((o,i)=>`<div class="tline ${i===correct?'correctLine':''}"><b>${String.fromCharCode(65+i)}. ${o}</b><div class="zh">${x.zh[i]}</div></div>`).join('')}</div><div class="explain">${x.key}</div>`}else if(p===2){detail=`<div class="translation"><b>Question</b><br>${x.audio}<div class="zh">${x.zhq}</div></div><div class="transcript">${x.opts.map((o,i)=>`<div class="tline ${i===correct?'correctLine':''}"><b>${String.fromCharCode(65+i)}. ${o}</b><div class="zh">${x.zh[i]}</div></div>`).join('')}</div><div class="explain">${x.key}</div>`}else if(p===3||p===4){let q=x.qs[state.sub];detail=`<div class="translation"><b>Transcript + 中文</b>${x.audio.map((a,i)=>`<div style="margin-top:8px">${a}<div class="zh">${x.zh[i]}</div></div>`).join('')}</div><div class="explain">${q[3]}</div>`}else if(p===5){detail=`<div class="translation"><b>中文翻譯</b><br>${x.zh}</div><div class="explain">${x.key}</div>`}else{let q=x.qs[state.sub];detail=`<div class="translation"><b>全文中文翻譯</b><br>${x.zh.replaceAll('\n','<br>')}</div><div class="explain">${q[3]}</div>`}r.innerHTML=`<div class="resultHead">${head}</div>${detail}<button class="next" onclick="next()">Next →</button><div class="clear"></div>`;r.classList.add('show');r.scrollIntoView({behavior:'smooth',block:'nearest'})}
function next(){let p=state.part,x=state.items[state.i];if((p===3||p===4)&&state.sub<x.qs.length-1){state.sub++;render();return}if((p===6||p===7)&&state.sub<x.qs.length-1){state.sub++;render();return}state.sub=0;state.i++;if(state.i>=state.items.length){finish()}else{render();window.scrollTo({top:0,behavior:'smooth'})}}
function finish(){document.getElementById('practice').innerHTML=`<div class="practiceCard finish"><div class="parttag">PART ${state.part} COMPLETE</div><h2>練習完成</h2><div class="score">${state.score}</div><div class="small">本次答對題數</div><br><button class="restart" onclick="selectPart(${state.part})">Back to Part ${state.part}</button> <button class="restart" onclick="dashboard()">Dashboard</button></div>`}
try{nav();dashboard();document.getElementById('offlineFallback').style.display='none'}catch(e){document.getElementById('offlineFallback').innerHTML='<h2>無法啟動練習</h2><p>此手機的檔案預覽環境不支援完整 JavaScript。請改用瀏覽器開啟，或透過 HTTPS 網站使用。</p><pre style="white-space:pre-wrap">'+String(e.message||e)+'</pre>'}
</script></body></html>
